name: Build & Push VU Wine Docker Image

on:
  release:
    types: [published]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bf3rm/vu-wine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Download mods zip into build context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download release -R ${{ github.repository }} \
            -p "Reality-Mods-Only.zip" --clobber

      - name: Check if this zip was already built
        id: build-cache
        uses: actions/cache@v4
        with:
          path: .build-hash
          key: docker-mods-${{ hashFiles('Reality-Mods-Only.zip') }}

      - name: Build and push Docker image
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Mark zip hash as built
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: touch .build-hash

      - name: Restart Pelican server
        if: steps.build-cache.outputs.cache-hit != 'true'
        env:
          PELICAN_KEY: ${{ secrets.PELICAN_CLIENT_KEY }}
          PELICAN_URL: ${{ secrets.PELICAN_URL }}
          SERVER_ID: e198ab8d
        run: |
          if [ -z "$PELICAN_KEY" ] || [ -z "$PELICAN_URL" ]; then
            echo "PELICAN_CLIENT_KEY or PELICAN_URL secret not set; skipping restart."
            exit 0
          fi
          curl -fsS -X POST "$PELICAN_URL/api/client/servers/$SERVER_ID/power" \
            -H "Authorization: Bearer $PELICAN_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"signal":"restart"}'
